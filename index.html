<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game UI Prompt Lab</title>
<meta name="description" content="게임 UI 디자인용 이미지 AI·코딩 AI 프롬프트 생성기. 오프라인 단일 파일.">
<style>
:root{
  --bg:#15161a; --panel:#1c1e23; --panel2:#23262c; --line:#30343c; --ink:#ecebe6; --mute:#9a9ca3; --faint:#6c6f77;
  --acc:#f2b84b; --acc-ink:#1b1608; --ok:#7fcf8e; --bad:#ef7a6a;
  --r:10px;
  font-family:"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.02em}
header h1 small{color:var(--faint);font-weight:400;margin-left:8px}
header .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);padding:7px 12px;border-radius:8px;cursor:pointer;min-height:34px}
.btn:hover{border-color:#4a4f59}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.btn.ghost{background:transparent}
main{display:grid;grid-template-columns:minmax(380px,1fr) minmax(420px,1.1fr);gap:0;min-height:calc(100vh - 59px)}
@media (max-width:980px){main{grid-template-columns:1fr}}
.left{padding:16px 20px 60px;border-right:1px solid var(--line)}
.right{padding:16px 20px 60px;position:sticky;top:59px;align-self:start;max-height:calc(100vh - 59px);overflow:auto}
@media (max-width:980px){.right{position:static;max-height:none}}
section.q{padding:14px 0;border-bottom:1px solid var(--line)}
section.q:last-child{border-bottom:0}
.qh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.qh b{font-size:13px}
.qh span{color:var(--faint);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:999px;cursor:pointer;font-size:13px;min-height:32px}
.chip:hover{border-color:#4a4f59}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.targets .chip{border-radius:8px;text-align:left;padding:8px 10px}
.targets .chip small{display:block;opacity:.65;font-size:11px;font-weight:400}
.group-label{font-size:11px;color:var(--faint);margin:10px 0 4px;letter-spacing:.06em}
.palettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pal{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px;cursor:pointer;text-align:left}
.pal[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.pal .sw{display:flex;height:18px;border-radius:4px;overflow:hidden;margin-bottom:4px}
.pal .sw i{flex:1}
.pal span{font-size:12px}
.colors{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.colors label{font-size:11px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
.colors input[type=color]{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:2px;cursor:pointer}
textarea,input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
textarea{min-height:56px}
.field{margin-top:8px}
.field label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
.out-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.out-head h2{font-size:13px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.box-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
.box-h .sp{flex:1}
.box pre{margin:0;padding:12px;white-space:pre-wrap;word-break:break-word;font-family:"Cascadia Mono",Consolas,"D2Coding",monospace;font-size:12.5px;line-height:1.6;max-height:440px;overflow:auto}
.count{font-variant-numeric:tabular-nums;color:var(--faint)}
.warn{font-size:12px;color:var(--bad);margin:4px 0 10px}
.warn:empty{display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .15s;pointer-events:none}
.toast.on{opacity:1}
/* preview */
.pv-wrap{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.pv{--p-bg:#222;--p-sf:#333;--p-pr:#f90;--p-se:#0af;--p-tx:#fff;--p-r:12px;
  background:var(--p-bg);color:var(--p-tx);border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line);flex:none}
.pv.portrait{width:190px;height:338px}
.pv.landscape{width:338px;height:190px}
.pv .top{display:flex;gap:5px;padding:8px;justify-content:space-between}
.pv .res{background:var(--p-sf);border-radius:var(--p-r);padding:3px 8px;font-size:10px;font-weight:700;display:flex;gap:4px;align-items:center}
.pv .res i{width:8px;height:8px;border-radius:50%;background:var(--p-se);display:inline-block}
.pv .card{background:var(--p-sf);border-radius:var(--p-r);margin:6px 8px;padding:8px;font-size:10px}
.pv .card b{display:block;font-size:12px;margin-bottom:4px}
.pv .bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--p-tx) 15%,transparent);overflow:hidden}
.pv .bar i{display:block;height:100%;width:62%;background:var(--p-se);border-radius:inherit}
.pv .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.pv .slots i{aspect-ratio:1;border-radius:calc(var(--p-r)*.6);background:color-mix(in srgb,var(--p-bg) 60%,var(--p-sf));border:1px solid color-mix(in srgb,var(--p-tx) 12%,transparent)}
.pv .cta{position:absolute;left:8px;right:8px;bottom:10px;background:var(--p-pr);color:var(--p-bg);text-align:center;font-weight:800;font-size:13px;padding:9px;border-radius:var(--p-r)}
.pv.landscape .cta{left:auto;width:120px}
.pv.landscape .card{width:150px;display:inline-block;vertical-align:top}
.pv.d-soft .card,.pv.d-soft .cta,.pv.d-soft .res{box-shadow:0 4px 10px rgba(0,0,0,.35)}
.pv.d-bevel .card,.pv.d-bevel .cta,.pv.d-bevel .res{box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.3)}
.pv.d-glow .cta{box-shadow:0 0 14px var(--p-pr)}
.pv.d-glow .card{box-shadow:0 0 0 1px var(--p-se),0 0 10px color-mix(in srgb,var(--p-se) 50%,transparent)}
.pv.s-line .card,.pv.s-line .res{background:transparent;border:1px solid color-mix(in srgb,var(--p-tx) 40%,transparent)}
.pv-note{font-size:12px;color:var(--mute)}
.pv-note p{margin:0 0 6px}
.contrast{font-variant-numeric:tabular-nums}
.contrast .ok{color:var(--ok)} .contrast .bad{color:var(--bad)}
/* drawer */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0;width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-h{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.dlg-h b{flex:1}
.dlg-b{padding:12px 14px;max-height:60vh;overflow:auto}
.dlg-f{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--faint)}
.empty{color:var(--faint);padding:20px 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Game UI Prompt Lab<small>게임 UI 프롬프트 생성기</small></h1>
  <div class="sp"></div>
  <button class="btn ghost" id="bRandom" title="선택을 무작위로 조합">무작위 조합</button>
  <button class="btn ghost" id="bShare" title="현재 설정이 담긴 링크 복사">공유 링크</button>
  <button class="btn" id="bLib">저장함</button>
  <button class="btn ghost" id="bReset">초기화</button>
</header>
<main>
  <div class="left" id="form"></div>
  <div class="right">
    <div class="out-head">
      <h2>미리보기</h2>
    </div>
    <div class="pv-wrap">
      <div class="pv portrait" id="pv" aria-label="색상과 형태 미리보기">
        <div class="top"><span class="res"><i></i>12,480</span><span class="res">Lv.24</span></div>
        <div class="card"><b>오늘의 임무</b><div class="bar"><i></i></div></div>
        <div class="card"><b>가방</b><div class="slots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
        <div class="cta">시작</div>
      </div>
      <div class="pv-note">
        <p>색, 모서리, 깊이감만 대략 보여 주는 견본입니다. 실제 화면은 생성 AI가 만듭니다.</p>
        <div class="contrast" id="contrast"></div>
      </div>
    </div>
    <div class="out-head">
      <h2>프롬프트</h2>
      <div class="seg" id="lang" role="group" aria-label="출력 언어">
        <button data-v="en" aria-pressed="true">English</button>
        <button data-v="ko" aria-pressed="false">한국어</button>
      </div>
      <div class="sp" style="flex:1"></div>
      <button class="btn" id="bSave">설정 저장</button>
    </div>
    <div class="warn" id="warn"></div>
    <div id="outs"></div>
  </div>
</main>

<dialog id="lib">
  <div class="dlg-h"><b>저장함</b><button class="btn ghost" data-close>닫기</button></div>
  <div class="dlg-b" id="libList"></div>
  <div class="dlg-f">
    <button class="btn" id="bExport">JSON 내보내기</button>
    <label class="btn" style="display:inline-flex;align-items:center">JSON 가져오기<input type="file" id="fImport" accept="application/json" hidden></label>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ---------- data ---------- */
// Each option: id, ko (UI label), en (prompt phrase), kp (Korean prompt phrase)
const TARGETS = [
  {id:"img-natural", group:"이미지 AI", ko:"자연어 이미지 AI", sub:"GPT 이미지 · Gemini · Ideogram"},
  {id:"img-mj", group:"이미지 AI", ko:"Midjourney", sub:"파라미터 포함"},
  {id:"img-sd", group:"이미지 AI", ko:"Stable Diffusion", sub:"태그 + 네거티브"},
  {id:"code-web", group:"코딩 AI", ko:"HTML/CSS", sub:"단일 파일 목업"},
  {id:"code-uitk", group:"코딩 AI", ko:"Unity UI Toolkit", sub:"UXML + USS"},
  {id:"code-ugui", group:"코딩 AI", ko:"Unity uGUI", sub:"Canvas + TMP"},
];
const Q = [
  {key:"screen", ko:"화면", hint:"하나", opts:[
    ["main","메인 메뉴","main menu / title screen","메인 메뉴(타이틀 화면)"],
    ["hud","인게임 HUD","in-game HUD overlay","인게임 HUD"],
    ["inventory","인벤토리","inventory and equipment screen","인벤토리·장비 화면"],
    ["shop","상점","in-game shop screen with item offers","상점 화면"],
    ["gacha","뽑기","gacha / loot box summon screen","뽑기(가챠) 화면"],
    ["result","결과·보상","stage clear result and reward screen","스테이지 결과·보상 화면"],
    ["levels","스테이지 선택","level select map screen","스테이지 선택 화면"],
    ["settings","설정","settings menu","설정 화면"],
    ["dialog","대화","character dialogue box with portrait","캐릭터 대화창"],
    ["loading","로딩","loading screen with progress and tip","로딩 화면"],
    ["popup","팝업","modal popup dialog","모달 팝업"],
  ]},
  {key:"platform", ko:"기기", hint:"하나", opts:[
    ["portrait","모바일 세로","mobile portrait 9:16","모바일 세로 9:16"],
    ["landscape","모바일 가로","mobile landscape 16:9","모바일 가로 16:9"],
    ["pc","PC·콘솔","PC / console 16:9 widescreen","PC·콘솔 16:9"],
  ]},
  {key:"genre", ko:"장르", hint:"하나", opts:[
    ["puzzle","캐주얼 퍼즐","casual puzzle","캐주얼 퍼즐"],
    ["idle","방치형","idle / incremental","방치형"],
    ["rpg","RPG","fantasy RPG","판타지 RPG"],
    ["action","액션","action","액션"],
    ["roguelike","로그라이크","roguelike","로그라이크"],
    ["sim","경영·시뮬","management simulation","경영 시뮬레이션"],
    ["shooter","슈팅","shooter","슈팅"],
    ["card","카드·덱빌딩","card battler / deckbuilder","카드 덱빌딩"],
    ["horror","호러","horror","호러"],
    ["party","파티·물리","physics party game","물리 파티 게임"],
  ]},
  {key:"style", ko:"아트 스타일", hint:"하나", opts:[
    ["flat","플랫 벡터","clean flat vector UI","깔끔한 플랫 벡터"],
    ["toon3d","말랑한 3D","glossy stylized 3D cartoon UI, chunky rounded shapes","광택 있는 카툰 3D, 통통한 둥근 형태"],
    ["pixel","픽셀 아트","crisp pixel art UI, limited palette, no anti-aliasing","선명한 픽셀 아트, 제한된 팔레트"],
    ["fantasy","판타지 장식","ornate fantasy UI with carved frames and metal trims","조각 프레임과 금속 장식의 판타지"],
    ["scifi","SF 홀로그램","sci-fi holographic interface with thin lines and scanlines","얇은 선과 스캔라인의 SF 홀로그램"],
    ["minimal","미니멀","minimal modern UI with generous spacing","여백 넓은 미니멀"],
    ["paper","손그림·종이","hand-drawn sketchy UI on paper texture","종이 질감의 손그림"],
    ["voxel","복셀","voxel / blocky 3D UI","복셀(블록) 3D"],
    ["neon","네온 사이버펑크","neon cyberpunk UI with glowing edges","빛나는 테두리의 네온 사이버펑크"],
    ["retro","레트로 아케이드","80s retro arcade UI","80년대 레트로 아케이드"],
  ]},
  {key:"mood", ko:"분위기", hint:"여러 개", multi:true, opts:[
    ["cheerful","밝고 경쾌","cheerful and playful","밝고 경쾌한"],
    ["cozy","아늑","cozy and warm","아늑하고 따뜻한"],
    ["epic","웅장","epic and heroic","웅장한"],
    ["tense","긴장감","tense and gritty","긴장감 있는"],
    ["dreamy","몽환","dreamy and soft","몽환적인"],
    ["premium","고급","premium and polished","고급스러운"],
    ["silly","엉뚱","silly and goofy","엉뚱한"],
  ]},
  {key:"shape", ko:"형태", hint:"하나", opts:[
    ["round","둥글고 말랑","soft rounded corners, pill buttons","둥근 모서리와 알약형 버튼","16px"],
    ["slight","약간 둥근","slightly rounded corners","살짝 둥근 모서리","8px"],
    ["sharp","각진","sharp angular corners and chamfered edges","각지고 모서리를 깎은 형태","2px"],
    ["line","얇은 선","thin outline frames, mostly transparent panels","얇은 외곽선 위주, 비어 있는 패널","6px"],
  ]},
  {key:"depth", ko:"깊이감", hint:"하나", opts:[

    ["soft","부드러운 그림자","subtle soft drop shadows","은은한 그림자"],
    ["bevel","입체 베벨","thick bevel and inner highlight, tactile buttons","두꺼운 베벨과 하이라이트, 눌릴 듯한 버튼"],

  {key:"density", ko:"정보 밀도", hint:"하나", opts:[

    ["balanced","보통","balanced information density","적당한 정보 밀도"],

  {key:"parts", ko:"넣을 요소", hint:"여러 개", multi:true, opts:[
    ["currency","재화 표시","currency counters (coins, gems)","재화 표시(코인, 보석)"],
    ["profile","프로필·레벨","player avatar and level badge","플레이어 아바타와 레벨 배지"],
    ["cta","큰 시작 버튼","one large primary action button","큰 주 버튼 하나"],
    ["tabs","하단 탭","bottom navigation tabs","하단 탭 내비게이션"],
    ["slots","아이템 슬롯","item slot grid with rarity frames","등급 테두리가 있는 아이템 슬롯 격자"],
    ["progress","진행 바","progress bar","진행 바"],
    ["badge","알림 배지","red notification badges","빨간 알림 배지"],
    ["hp","체력·자원 바","health and energy bars","체력·에너지 바"],
    ["skills","스킬 버튼","skill buttons with cooldown","쿨다운 표시가 있는 스킬 버튼"],
    ["minimap","미니맵","minimap","미니맵"],
    ["quest","퀘스트 목록","quest / mission list","퀘스트 목록"],
    ["timer","타이머","countdown timer","카운트다운 타이머"],
    ["stars","별점 평가","3-star rating","별 3개 평가"],
    ["offer","특가 배너","limited-time offer banner","기간 한정 특가 배너"],
  ]},
];
const PALETTES = [
  {id:"candy", ko:"사탕", c:["#fff4e8","#ffffff","#ff6b8b","#41c7c7","#3b2a3f"]},
  {id:"forest", ko:"숲속", c:["#1f2b22","#2e3f31","#e8b54a","#8fc27a","#f3eedd"]},
  {id:"royal", ko:"왕궁", c:["#191529","#2a2342","#e4b363","#7f6bd6","#f2ead9"]},
  {id:"ocean", ko:"바다", c:["#0f2233","#173650","#ffcf5c","#3fb6e8","#eaf6ff"]},
  {id:"neon", ko:"네온", c:["#0b0b14","#161629","#ff3df0","#21f0e0","#f2f2ff"]},
  {id:"mono", ko:"흑백 강조", c:["#121212","#1f1f1f","#f5d000","#9e9e9e","#f0f0f0"]},
  {id:"paper", ko:"종이", c:["#efe6d2","#faf5e9","#c8553d","#2d6a8a","#2b2520"]},

function load(){

  return structuredClone(DEFAULT);
}
function sanitize(s){
  const o=structuredClone(DEFAULT);
  for(const k in o){ if(s[k]!==undefined && typeof s[k]===typeof o[k] && Array.isArray(s[k])===Array.isArray(o[k])) o[k]=s[k]; }
  if(!TARGETS.some(t=>t.id===o.target)) o.target=DEFAULT.target;
  for(const q of Q){
    const ids=q.opts.map(x=>x[0]);
    if(q.multi) o[q.key]=o[q.key].filter(v=>ids.includes(v));
    else if(!ids.includes(o[q.key])) o[q.key]=DEFAULT[q.key];
  }
  if(o.colors.length!==5 || !o.colors.every(c=>/^#[0-9a-f]{6}$/i.test(c))) o.colors=DEFAULT.colors.slice();
  return o;
}
function readHash(){
  if(!location.hash.startsWith("#s=")) return null;

function lum(hex){ const v=[1,3,5].map(i=>parseInt(hex.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4); return .2126*v[0]+.7152*v[1]+.0722*v[2]; }
function ratio(a,b){ const x=lum(a),y=lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); }
function hueName(hex){
  const r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  const s=d===0?0:d/(1-Math.abs(2*l-1));
  if(s<.15) return l>.85?["off-white","흰색 계열"]:l<.15?["near-black","검정 계열"]:["gray","회색"];
  let h=0; if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4; h=(h*60+360)%360;
  const pre=l<.3?["deep ","짙은 "]:l>.75?["pale ","연한 "]:["",""];
  const names=[[15,"red","빨강"],[40,"orange","주황"],[65,"golden yellow","노랑"],[160,"green","초록"],[200,"teal","청록"],[250,"blue","파랑"],[290,"purple","보라"],[335,"magenta pink","분홍"],[360,"red","빨강"]];
  const n=names.find(x=>h<x[0]);
  return [pre[0]+n[1], pre[1]+n[2]];
}

  const c=ctx(L), t=tokens(), ko=L==="ko";
  const head=ko?`Unity 6 uGUI(Canvas)와 TextMeshPro로 게임 UI 화면을 만드는 에디터 스크립트를 작성해 주세요. 스크립트를 실행하면 씬에 화면 계층이 생성되어야 합니다.`
    :`Write a Unity 6 editor script that builds this game UI screen with uGUI (Canvas) and TextMeshPro. Running it should create the full hierarchy in the open scene.`;
  const tail=ko?`## 구현 조건
- 메뉴: Tools/UI/Build ${pascal()} Screen. Undo.RegisterCreatedObjectUndo로 되돌릴 수 있게.
- Canvas Scaler: Scale With Screen Size, 기준 ${RES[S.platform]}, Match ${S.platform==="portrait"?"0":"1"}.
- 색은 ScriptableObject 테마(UITheme: bg, surface, primary, secondary, text)에서 읽기. 테마 에셋이 없으면 위 값으로 생성.
- 앵커와 피벗을 올바르게 설정해 비율이 달라도 무너지지 않게. 고정 좌표 남발 금지, Layout Group 우선.
- 둥근 모서리는 9-slice 스프라이트 자리로 두고, 없으면 기본 UISprite 사용.
- 버튼은 Button 컴포넌트의 ColorTint 전환(눌림 색은 primary를 15% 어둡게).
- 세이프 에어리어용 SafeArea 컴포넌트를 루트 패널에 붙이기.
## 출력
- 에디터 스크립트, UITheme, SafeArea 전체 코드. 설명은 짧게.`
    :`## Implementation
- Menu item: Tools/UI/Build ${pascal()} Screen. Register created objects with Undo.
- Canvas Scaler: Scale With Screen Size, reference ${RES[S.platform]}, Match ${S.platform==="portrait"?"0":"1"}.
- Read colors from a ScriptableObject theme (UITheme: bg, surface, primary, secondary, text); create it with the values above if missing.
- Set anchors and pivots so the layout survives other aspect ratios. Prefer Layout Groups over hard-coded positions.
- Rounded corners: leave a 9-slice sprite slot, fall back to the built-in UISprite.
- Buttons use ColorTint transitions (pressed = primary darkened 15%).
- Add a SafeArea component on the root panel.
## Output
- Full code for the editor script, UITheme and SafeArea. Brief notes.`;
  return [{label:"프롬프트",text:`${head}\n\n${codeCommon(L,c,t)}\n\n${tail}`}];
}
function pascal(){
  return (opt("screen",S.screen)[2].split(/[^a-zA-Z]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()+w.slice(1)).join("")) || "Game";
}
const BUILD={"img-natural":imgNatural,"img-mj":imgMJ,"img-sd":imgSD,"code-web":codeWeb,"code-uitk":codeUITK,"code-ugui":codeUGUI};

/* ---------- output ---------- */
function renderOut(){
  const outs=BUILD[S.target](S.lang);
  $("#outs").innerHTML=outs.map((o,i)=>`<div class="box"><div class="box-h"><span>${esc(o.label)}</span><span class="count">${o.text.length.toLocaleString()}자</span><span class="sp"></span><button class="btn" data-copy="${i}">복사</button></div><pre>${esc(o.text)}</pre></div>`).join("");
  $("#outs").onclick=e=>{ const b=e.target.closest("[data-copy]"); if(b){ copy(outs[+b.dataset.copy].text); addHistory(); } };
  const w=[];
  if(!S.mood.length) w.push("분위기를 하나 이상 고르면 결과가 덜 밋밋합니다.");
  if(S.parts.length>7) w.push(`요소가 ${S.parts.length}개입니다. 이미지 AI는 6개 안팎일 때 빠뜨리는 요소가 적습니다.`);
  if(S.screen==="hud" && S.parts.includes("tabs")) w.push("HUD에 하단 탭은 보통 넣지 않습니다.");
  $("#warn").textContent=w.join(" ");
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.lang));
}
function renderPreview(){
  const p=$("#pv"), t=tokens();
  p.className="pv "+(S.platform==="portrait"?"portrait":"landscape")+" d-"+S.depth+(S.shape==="line"?" s-line":"");
  p.style.setProperty("--p-bg",t.bg); p.style.setProperty("--p-sf",t.sf); p.style.setProperty("--p-pr",t.pr);
  p.style.setProperty("--p-se",t.se); p.style.setProperty("--p-tx",t.tx); p.style.setProperty("--p-r",t.r);
  const ctaInk = ratio(t.pr,t.bg)>ratio(t.pr,t.tx)?t.bg:t.tx;
  p.querySelector(".cta").style.color=ctaInk;
  const rows=[["글자/배경",ratio(t.tx,t.bg)],["글자/패널",ratio(t.tx,t.sf)],["버튼 글자",ratio(t.pr,ctaInk)]];
  $("#contrast").innerHTML="대비 (본문 4.5 이상 권장)<br>"+rows.map(([n,v])=>`${n} <span class="${v>=4.5?"ok":v>=3?"":"bad"}">${v.toFixed(1)}:1</span>`).join(" · ");
}
function update(full){
  if(full) syncPressed();
  renderOut(); renderPreview(); persist();
  if(location.hash) history.replaceState(null,"",location.pathname+location.search);
}

/* ---------- library ---------- */
function lib(){ try{ return JSON.parse(localStorage.getItem(LS_LIB))||{saved:[],history:[]}; }catch(e){ return {saved:[],history:[]}; } }
function setLib(l){ localStorage.setItem(LS_LIB,JSON.stringify(l)); }
function summary(s){ return [opt("screen",s.screen)[1],opt("genre",s.genre)[1],opt("style",s.style)[1],TARGETS.find(t=>t.id===s.target).ko].join(" · "); }
function addHistory(){
  const l=lib(), snap=JSON.stringify(S);
  if(l.history[0] && JSON.stringify(l.history[0].s)===snap) return;
  l.history.unshift({at:Date.now(),s:structuredClone(S)}); l.history=l.history.slice(0,30); setLib(l);
}
function renderLib(){
  const l=lib();
  const row=(it,kind,i)=>`<div class="item"><div class="t"><div>${esc(it.name||summary(it.s))}</div><small>${new Date(it.at).toLocaleString("ko-KR")}${it.name?" · "+esc(summary(it.s)):""}</small></div><button class="btn" data-load="${kind}:${i}">불러오기</button><button class="btn ghost" data-del="${kind}:${i}">삭제</button></div>`;
  $("#libList").innerHTML=`<div class="group-label">저장한 설정</div>${l.saved.length?l.saved.map((x,i)=>row(x,"saved",i)).join(""):`<div class="empty">아직 없습니다.</div>`}
    <div class="group-label">최근 복사 기록 (최대 30개)</div>${l.history.length?l.history.map((x,i)=>row(x,"history",i)).join(""):`<div class="empty">프롬프트를 복사하면 여기에 남습니다.</div>`}`;
}
$("#libList").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; const l=lib();
  if(b.dataset.load){ const [k,i]=b.dataset.load.split(":"); S=sanitize(l[k][+i].s); renderForm(); update(true); $("#lib").close(); toast("불러왔습니다"); }
  if(b.dataset.del){ const [k,i]=b.dataset.del.split(":"); l[k].splice(+i,1); setLib(l); renderLib(); }
});
$("#bLib").onclick=()=>{ renderLib(); $("#lib").showModal(); };
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());
$("#bSave").onclick=()=>{
  const name=prompt("이 설정의 이름", S.title?`${S.title} ${opt("screen",S.screen)[1]}`:summary(S)); if(name===null) return;
  const l=lib(); l.saved.unshift({name:name.trim().slice(0,60),at:Date.now(),s:structuredClone(S)}); setLib(l); toast("저장했습니다");
};
$("#bExport").onclick=()=>{
  const blob=new Blob([JSON.stringify({app:"game-ui-prompt-lab",version:1,...lib()},null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="game-ui-prompt-lab-backup.json"; a.click(); URL.revokeObjectURL(a.href);
};
$("#fImport").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const d=JSON.parse(await f.text()); if(!Array.isArray(d.saved)) throw 0;
    const l=lib(); l.saved=[...d.saved.filter(x=>x&&x.s).map(x=>({...x,s:sanitize(x.s)})),...l.saved].slice(0,200);
    l.history=[...(d.history||[]).filter(x=>x&&x.s).map(x=>({...x,s:sanitize(x.s)})),...l.history].slice(0,30);
    setLib(l); renderLib(); toast("가져왔습니다");
  }catch(err){ toast("백업 파일 형식이 아닙니다"); }
  e.target.value="";
};

/* ---------- header actions ---------- */
$("#lang").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; S.lang=b.dataset.v; update(false); };
$("#bReset").onclick=()=>{ if(!confirm("모든 선택을 기본값으로 되돌릴까요? 저장함은 그대로 남습니다.")) return; S=structuredClone(DEFAULT); renderForm(); update(true); };
$("#bShare").onclick=()=>{
  const url=location.href.split("#")[0]+"#s="+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  copy(url);
};
$("#bRandom").onclick=()=>{
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  for(const q of Q){
    if(q.key==="platform") continue;
    const ids=q.opts.map(o=>o[0]);
    if(q.multi){ const n=q.key==="mood"?1+Math.floor(Math.random()*2):4+Math.floor(Math.random()*2); S[q.key]=[...ids].sort(()=>Math.random()-.5).slice(0,n); }
    else S[q.key]=pick(ids);
  }
  const p=pick(PALETTES); S.palette=p.id; S.colors=p.c.slice();
  update(true);
};

renderForm(); update(true);
</script>
</body>
</html>

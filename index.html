<!doctype html>
<html lang="ko" data-app-version="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game UI Prompt Lab v2</title>
<meta name="description" content="13단계로 게임 UI를 고르면 실시간 미리보기와 함께 이미지 AI·코딩 AI용 프롬프트를 만들어 주는 단일 파일 도구.">
<style id="tool-css">
/* ========== TOOL SHELL ========== */
:root{
  color-scheme:dark;
  --t-bg:#101113; --t-panel:#17181b; --t-panel2:#1f2125; --t-line:#2c2f34; --t-line2:#43474e;
  --t-ink:#e8e6e1; --t-mute:#a2a4a8; --t-faint:#7f8186;
  --t-acc:#c6f24e; --t-acc-ink:#141a05; --t-warn:#f0b64a; --t-bad:#f0776a; --t-ok:#7fd08f;
  --t-font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;
  --t-mono:"Cascadia Mono","D2Coding",Consolas,"Malgun Gothic",monospace;
  --hd:52px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--t-bg);color:var(--t-ink);font:14px/1.5 var(--t-font)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--t-acc)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--t-acc);outline-offset:1px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#34373d;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--hd) minmax(0,1fr);height:100dvh}
.hd{display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--t-line);background:var(--t-panel);min-width:0}
.brand{display:flex;align-items:center;gap:8px;margin-right:8px;white-space:nowrap;font-weight:700;letter-spacing:.01em}
.brand i{width:12px;height:12px;background:var(--t-acc);display:block;clip-path:polygon(0 0,100% 0,100% 62%,62% 100%,0 100%)}
.brand small{font:600 11px var(--t-mono);color:var(--t-faint)}
.hd-tools,.hd-right{display:flex;align-items:center;gap:6px;min-width:0}
.hd-right{margin-left:auto}
.tbtn{height:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--t-panel2);border:1px solid var(--t-line);border-radius:6px;font-size:12.5px;white-space:nowrap;text-decoration:none;color:var(--t-ink)}
.tbtn:hover:not([disabled]){border-color:var(--t-line2);background:#26282d}
.tbtn[disabled]{opacity:.42;cursor:default}
.tbtn.pri{background:var(--t-acc);color:var(--t-acc-ink);border-color:var(--t-acc);font-weight:700}
.tbtn.pri:hover:not([disabled]){background:#d3fa66;border-color:#d3fa66}
.tbtn.on{border-color:var(--t-acc);color:var(--t-acc)}
.tbtn.ghost{background:transparent}
.tbtn.sm{height:26px;padding:0 8px;font-size:12px}
.tbtn svg{width:14px;height:14px;fill:currentColor;flex:none}
.bdg{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--t-acc);color:var(--t-acc-ink);font:700 11px/18px var(--t-mono);text-align:center}

.main{display:grid;grid-template-columns:214px minmax(0,1fr) minmax(430px,45%);min-height:0}
/* sidebar */
.side{overflow:auto;border-right:1px solid var(--t-line);padding:10px 0;background:var(--t-bg)}
.st{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 22px;align-items:center;gap:2px;width:100%;padding-right:8px;color:var(--t-mute)}
.st-go{display:grid;grid-template-columns:26px minmax(0,1fr) 10px;align-items:center;gap:4px;width:100%;height:37px;padding:0 0 0 12px;background:none;border:0;text-align:left;color:inherit}
.st:hover{background:var(--t-panel)}
.st .n{font:600 11px var(--t-mono);color:var(--t-faint)}
.st .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.st .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--t-line2);display:block}
.st.done .dot{background:var(--t-mute);border-color:var(--t-mute)}
.st.cur{color:var(--t-ink);background:var(--t-panel)}
.st.cur::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--t-acc)}
.st.cur .n{color:var(--t-acc)}
.st.cur .dot{background:var(--t-acc);border-color:var(--t-acc);box-shadow:0 0 0 3px rgba(198,242,78,.2)}
.st .lk{width:22px;height:22px;display:grid;place-items:center;border-radius:4px;color:var(--t-faint);opacity:.55;background:none;border:0;padding:0}
.st:hover .lk,.st .lk.on{opacity:1}
.st .lk.on{color:var(--t-acc)}
.st .lk svg{width:12px;height:12px;fill:currentColor}
.st .hc{font:700 10px/16px var(--t-mono);background:var(--t-warn);color:#231702;border-radius:8px;padding:0 5px}
.side-note{margin:12px 12px 4px;font-size:11.5px;color:var(--t-faint);line-height:1.45}

/* center */
.center{overflow:auto;padding:18px 22px 40px;min-width:0}
.q-no{font:600 12px var(--t-mono);color:var(--t-acc);letter-spacing:.04em}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.q h1{font-size:24px;line-height:1.25;margin-top:2px;font-weight:800;letter-spacing:-.01em}
.q .why{color:var(--t-mute);margin-top:4px;max-width:62ch}
.q-tools{display:flex;gap:8px;margin:14px 0 12px;align-items:center;flex-wrap:wrap}
.in{height:32px;padding:0 10px;background:var(--t-panel);border:1px solid var(--t-line);border-radius:6px;min-width:0}
.q-tools .in{flex:1;min-width:150px}
.q-group{font:600 12px var(--t-mono);color:var(--t-faint);margin:14px 0 6px;letter-spacing:.03em}
.q-group:first-of-type{margin-top:0}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:8px}
.opt{position:relative;display:flex;flex-direction:column;gap:6px;padding:7px;text-align:left;background:var(--t-panel);border:1px solid var(--t-line);border-radius:8px;min-width:0}
.opt:hover{border-color:var(--t-line2);background:#1b1d20}
.opt.sel{border-color:var(--t-acc);box-shadow:inset 0 0 0 1px var(--t-acc);background:#1c2015}
.opt-smp{position:relative;display:block;height:82px;border-radius:5px;overflow:hidden;background:var(--bg)}
.opt-k{position:absolute;left:12px;top:12px;z-index:3;font:700 10px/15px var(--t-mono);padding:0 4px;border-radius:3px;background:rgba(0,0,0,.62);color:#fff}
.opt-chk{position:absolute;right:12px;top:12px;z-index:3;width:20px;height:20px;border-radius:50%;background:var(--t-acc);color:var(--t-acc-ink);display:none;place-items:center}
.opt-chk svg{width:12px;height:12px;fill:currentColor}
.opt.sel .opt-chk{display:grid}
.opt-t{font-weight:700;font-size:13.5px;line-height:1.3}
.opt-s{color:var(--t-mute);font-size:12px;line-height:1.35}
.free{display:block;margin-top:14px}
.free span{display:block;font-size:12.5px;color:var(--t-mute);margin-bottom:4px}
.free textarea{width:100%;min-height:54px;background:var(--t-panel);border:1px solid var(--t-line);border-radius:6px;padding:8px 10px;resize:vertical}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.q-nav .kbd{color:var(--t-faint);font-size:11.5px;text-align:center}
.nomatch{padding:26px 8px;color:var(--t-faint);text-align:center}
.all-sec{margin-bottom:22px}
.all-sec h2{font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.all-sec h2 span{font:600 11px var(--t-mono);color:var(--t-acc)}

/* result */
.rs-bar{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.seg{display:inline-flex;border:1px solid var(--t-line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 12px;height:30px;font-size:12.5px;color:var(--t-mute)}
.seg button[aria-pressed="true"]{background:var(--t-ink);color:var(--t-bg);font-weight:700}
.box{background:var(--t-panel);border:1px solid var(--t-line);border-radius:8px;margin-bottom:10px;min-width:0}
.box-h{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--t-line);flex-wrap:wrap}
.box-h b{font-size:13px}
.box-h .cnt{font:12px var(--t-mono);color:var(--t-faint)}
.box-h .sp{flex:1}
.box pre{margin:0;padding:10px 12px;white-space:pre-wrap;word-break:break-word;font:13px/1.65 var(--t-font);max-height:380px;overflow:auto}
.box pre.mono{font:12.5px/1.6 var(--t-mono)}
.note{font-size:12px;color:var(--t-mute);margin-bottom:8px}
.sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:10px 12px;font-size:13px}
.sum dt{color:var(--t-faint)} .sum dd{margin:0}
.swrow{display:flex;gap:3px;padding:0 12px 12px;flex-wrap:wrap}
.swrow i{width:22px;height:22px;border-radius:4px;display:block;border:1px solid rgba(255,255,255,.14)}
.hints{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.hint{display:flex;gap:7px;font-size:12.5px;line-height:1.4;padding:6px 9px;border-left:3px solid var(--t-warn);background:rgba(240,182,74,.08);border-radius:0 5px 5px 0}
.hint.info{border-left-color:#7a8aa0;background:rgba(122,138,160,.1)}
.hint.bad{border-left-color:var(--t-bad);background:rgba(240,119,106,.1)}
.hint button{margin-left:auto;background:none;border:0;color:var(--t-acc);font-size:12px;padding:0;white-space:nowrap}

/* playground */
.play{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--t-line);background:#0b0c0e;min-width:0}
.pl-hd{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--t-line);flex-wrap:wrap;background:var(--t-panel)}
.pl-hd h2{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;margin-right:4px;white-space:nowrap}
.pl-hd h2 em{font:700 10px/14px var(--t-mono);color:var(--t-acc);font-style:normal;padding:0 4px;border:1px solid var(--t-acc);border-radius:3px}
.pl-hd h2 em::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--t-acc);margin-right:4px;vertical-align:1px;animation:live 1.6s infinite}
@keyframes live{50%{opacity:.25}}
.pl-tools{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap}
.pl-body{flex:1;min-height:0;position:relative;display:flex;padding:12px}
.pl-body>div{flex:1;min-width:0;min-height:0}
.pl-state{overflow:auto}
.pl-foot{border-top:1px solid var(--t-line);padding:8px 10px;max-height:118px;overflow:auto;background:var(--t-panel)}
.pl-foot .hints{margin:0}
.pl-meta{font:11.5px var(--t-mono);color:var(--t-faint);margin-bottom:6px;display:flex;gap:10px;flex-wrap:wrap}

/* drawer + dialogs */
.drawer{position:fixed;top:var(--hd);bottom:0;left:0;width:min(640px,100%);background:var(--t-panel);border-right:1px solid var(--t-line2);transform:translateX(-102%);visibility:hidden;transition:transform .2s ease,visibility .2s;z-index:30;display:flex;flex-direction:column;box-shadow:12px 0 30px rgba(0,0,0,.4)}
.drawer.on{transform:none;visibility:visible}
.dr-hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--t-line)}
.dr-hd b{font-size:15px;flex:1}
.dr-tabs{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--t-line);overflow-x:auto}
.dr-tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;color:var(--t-mute);white-space:nowrap;font-size:13px}
.dr-tabs button[aria-selected="true"]{color:var(--t-ink);border-bottom-color:var(--t-acc);font-weight:700}
.dr-b{flex:1;overflow:auto;padding:14px 12px 30px}
.lab{font-size:12.5px;color:var(--t-mute);margin:12px 0 5px;display:block}
.lab:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{height:30px;padding:0 10px;background:var(--t-panel2);border:1px solid var(--t-line);border-radius:6px;font-size:12.5px}
.chip[aria-pressed="true"]{border-color:var(--t-acc);color:var(--t-acc);font-weight:700}
.fontgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.fontc{padding:8px 10px;background:var(--t-panel2);border:1px solid var(--t-line);border-radius:6px;text-align:left}
.fontc[aria-pressed="true"]{border-color:var(--t-acc)}
.fontc b{display:block;font-size:17px;line-height:1.3}
.fontc small{color:var(--t-mute);font:11px var(--t-font)}
.ctable{width:100%;border-collapse:collapse;font-size:12.5px}
.ctable th{font-weight:500;color:var(--t-faint);text-align:left;padding:4px 4px;font-size:11.5px;border-bottom:1px solid var(--t-line)}
.ctable td{padding:4px 4px;border-bottom:1px solid #24262a;vertical-align:middle}
.ctable input[type=color]{width:34px;height:26px;padding:0;background:none;border:1px solid var(--t-line2);border-radius:4px;display:block}
.ctable .hex{width:82px;height:26px;background:var(--t-bg);border:1px solid var(--t-line);border-radius:4px;padding:0 6px;font:12px var(--t-mono)}
.ctable .rgb{font:11.5px var(--t-mono);color:var(--t-faint);white-space:nowrap}
.pf{font:700 11px var(--t-mono);padding:0 5px;border-radius:3px;white-space:nowrap}
.pf.ok{color:#0e2413;background:var(--t-ok)}
.pf.no{color:#2b0d09;background:var(--t-bad)}
.pairsmp{display:inline-grid;place-items:center;min-width:30px;height:22px;border-radius:3px;font-size:11px;font-weight:700;padding:0 4px}
.ref{padding:9px 0;border-bottom:1px solid #24262a}
.ref b{font-size:13.5px}
.ref .m{font-size:11.5px;color:var(--t-faint);margin:1px 0 3px}
.ref p{font-size:12.5px;color:var(--t-mute)}
.row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #24262a;min-width:0}
.row .t{flex:1;min-width:0}
.row .t b,.row .t div{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.row .t small{color:var(--t-faint);font-size:11.5px}
.row .swz{display:flex;width:44px;height:30px;border-radius:4px;overflow:hidden;flex:none}
.row .swz i{flex:1}
.empty{padding:26px 8px;color:var(--t-faint);text-align:center;font-size:13px}
dialog.dlg{background:var(--t-panel);color:var(--t-ink);border:1px solid var(--t-line2);border-radius:10px;padding:0;width:min(920px,calc(100vw - 24px));max-height:calc(100dvh - 32px)}
dialog.dlg::backdrop{background:rgba(0,0,0,.62)}
dialog.dlg.wide{width:min(1500px,calc(100vw - 24px));height:calc(100dvh - 32px)}
.dl-in{display:flex;flex-direction:column;height:100%;max-height:calc(100dvh - 34px)}
.dl-hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--t-line);flex-wrap:wrap}
.dl-hd b{font-size:15px;flex:1;min-width:120px}
.dl-b{flex:1;overflow:auto;padding:12px;min-height:0}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.preset{display:flex;flex-direction:column;gap:6px;padding:0;background:var(--t-panel2);border:1px solid var(--t-line);border-radius:8px;text-align:left;overflow:hidden}
.preset:hover{border-color:var(--t-acc)}
.preset .smp{height:88px;position:relative;overflow:hidden;display:block}
.preset .tx{padding:2px 10px 10px;display:block}
.preset b{font-size:13.5px;display:block}
.preset small{color:var(--t-mute);font-size:12px;line-height:1.35;display:block}
.logv{margin:6px 0 2px;padding:9px;background:var(--t-bg);border:1px solid var(--t-line);border-radius:6px;white-space:pre-wrap;word-break:break-word;font:12px/1.55 var(--t-mono);max-height:260px;overflow:auto}
.cmp-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cmp-pick label{display:flex;gap:6px;align-items:center;padding:4px 10px 4px 7px;background:var(--t-panel2);border:1px solid var(--t-line);border-radius:6px;font-size:12.5px}
.cmp-grid{display:grid;gap:10px;height:calc(100% - 46px);min-height:0}
.cmp-cell{display:flex;flex-direction:column;min-height:0;min-width:0;background:#0b0c0e;border:1px solid var(--t-line);border-radius:8px;padding:8px}
.cmp-cell h3{font-size:13px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-cell>div{flex:1;min-height:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,10px);background:var(--t-ink);color:var(--t-bg);padding:8px 14px;border-radius:7px;font-size:13px;font-weight:600;opacity:0;transition:opacity .16s,transform .16s;pointer-events:none;z-index:99;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* visual samples */
.r{position:absolute;display:block}
.sm-c{position:absolute;inset:0;display:grid;place-items:center}
.sm-ic svg{width:30px;height:30px;fill:var(--ink,#cfd2d6)}
.sm-tx{font:700 11px var(--t-mono);color:#d7d9dc}
.sm-dev{background:#0d0e10}
.sw14{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:1fr 1fr}
.sw14 i{display:block}

@media (max-width:1180px){
  .main{grid-template-columns:190px minmax(0,1fr) minmax(360px,42%)}
  .hd-tools .tbtn{padding:0 7px}
}
@media (max-width:980px){
  :root{--hd:88px}
  #app{height:auto;min-height:100dvh;grid-template-rows:auto minmax(0,1fr)}
  .hd{flex-wrap:wrap;padding:7px 10px;position:sticky;top:0;z-index:20}
  .brand{margin-right:auto}
  .hd-right{margin-left:0}
  .hd-tools{order:3;width:100%;overflow-x:auto;padding-bottom:1px}
  .main{display:block}
  .side{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--t-line);padding:0;position:sticky;top:var(--hd-real,88px);z-index:15}
  .st{display:flex;width:auto;flex:none;padding-right:4px}
  .st-go{grid-template-columns:auto auto auto;width:auto;height:42px;padding:0 8px 0 10px}
  .st .lk{display:none}
  .st.cur::before{left:0;right:0;top:auto;bottom:0;width:auto;height:3px}
  .side-note{display:none}
  .center{padding:14px 12px 22px;overflow:visible}
  .q h1{font-size:21px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .play{border-left:0;border-top:1px solid var(--t-line)}
  .pl-body{aspect-ratio:var(--stage-ar,1.5);max-height:min(74vh,640px);min-height:200px;flex:none;padding:8px}
  .pl-body.is-state{aspect-ratio:auto;height:min(74vh,640px)}
  .pl-foot{max-height:none}
  .drawer{top:0;z-index:40}
  dialog.dlg.wide{height:calc(100dvh - 16px)}
}
@media (max-width:520px){
  .pl-tools{margin-left:0;width:100%}
  .q-nav .kbd{display:none}
  .box-h .sp{flex-basis:100%;height:0}
  .ctable .rgb,.ctable th:nth-child(3){display:none}
  .hd .lbl{display:none}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style id="gs-css">
/* ========== GAME SCREEN (preview stage, also embedded in exported mockups) ========== */
.gs-host{display:flex;overflow:auto;min-width:0;min-height:0;width:100%;height:100%}
.gs-sizer{position:relative;margin:auto;flex:none}
.dev{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:10px}
.dev.phone{background:#050506;border-radius:58px;padding:16px;box-shadow:inset 0 0 0 2px #2c2e33}
.dev.phone .gs{border-radius:42px}
.dev.phone::before{content:"";position:absolute;left:50%;top:26px;width:110px;height:24px;margin-left:-55px;border-radius:14px;background:#000;z-index:5}
.dev.phonew{background:#050506;border-radius:52px;padding:16px;box-shadow:inset 0 0 0 2px #2c2e33}
.dev.phonew .gs{border-radius:38px}

.g-hud[data-l=split] .h-skill{flex-direction:column;bottom:auto;top:50%;translate:0 -30%}

.g-hud[data-l=grid] .h-skill{display:grid;grid-template-columns:repeat(2,auto)}

.g-hud[data-l=radial] .sk:nth-child(3){right:7em;bottom:4.6em}

.g-hud[data-l=sheet] .h-skill{right:0;left:0;bottom:0;padding:var(--sp) var(--sp) calc(var(--sp) + var(--safe-b,0px));justify-content:center;background:var(--sf);border-top:var(--bw) solid var(--bd);border-radius:var(--r) var(--r) 0 0}

.gs.shake-2{animation:gs-shake2 .24s linear}

.gs-mini.fx-a[data-fx=glow] .btn.pri{animation:mf-glow 1.9s infinite}
.gs-mini.fx-a[data-fx=tint] .btn.pri{animation:mf-tint 1.9s infinite}
.gs-mini.fx-a[data-fx=bounce] .btn.pri{animation:mf-bounce 1.9s infinite}
.gs-mini.fx-a[data-fx=slide] .btn.pri{animation:mf-slide 1.9s infinite}

  const isRes=s.key==="result";
  return`<div class="st${cur?" cur":""}${done?" done":""}"><button class="st-go" data-step="${i}" title="${esc(s.ko)}" ${cur?'aria-current="step"':""}><span class="n">${String(i+1).padStart(2,"0")}</span><span class="t">${esc(s.ko)}</span><span class="dot" aria-label="${cur?"현재":done?"완료":"미선택"}"></span></button>${isRes?(hc?`<span class="hc" title="품질 힌트 ${hc}개">${hc}</span>`:"<span></span>"):`<button class="lk${UI.locks[s.key]?" on":""}" data-lock="${s.key}" aria-pressed="${!!UI.locks[s.key]}" aria-label="${esc(s.ko)} 무작위 잠금" title="무작위 조합에서 잠금">${UI.locks[s.key]?LOCK:UNLOCK}</button>`}</div>`;

function applyFilter(){
 const q=UI.query.trim().toLowerCase();
 let any=false;
 $$("#qOpts .opt").forEach(b=>{const m=!q||b.dataset.h.includes(q);b.hidden=!m;if(m)any=true});
 $$("#qOpts .opts").forEach(g=>{g.hidden=![...g.children].some(b=>!b.hidden);const prev=g.previousElementSibling;if(prev&&prev.classList.contains("q-group"))prev.hidden=g.hidden});
 $$("#qOpts [data-sec]").forEach(s=>s.hidden=!s.querySelector(".opts:not([hidden])"));
 const none=$("#qNone");if(none)none.hidden=any;
 let n=0;$$("#qOpts .opt:not([hidden]) .opt-k").forEach(k=>{n++;k.textContent=n%10;k.hidden=n>10||UI.view==="all"});
}
function syncSelections(){
 $$(".opt").forEach(b=>{const on=D[b.dataset.g]===b.dataset.v;b.classList.toggle("sel",on);b.setAttribute("aria-checked",on)});
 const f=$("#qFree");if(f&&document.activeElement!==f)f.value=D.custom[f.dataset.free]||"";
}
function go(i){
 const st=STEPS[UI.step];if(UI.view==="step"&&st&&st.key!=="result"&&i>UI.step)UI.done[st.key]=true;
 UI.view="step";UI.step=Math.max(0,Math.min(STEPS.length-1,i));UI.query="";
 renderSide();renderCenter();$("#center").scrollTop=0;persist();
}

 $("#center").setAttribute("style",P.varsStyle(D));

/* ========== QUALITY HINTS ========== */
function contrastFails(){return ROLES.filter(r=>contrast(D.colors[r.k],D.colors[r.pair])<r.need)}
function hints(){
 const h=[],add=(lv,text,act)=>h.push({lv,text,act});
 const r=RATIOS[D.ratio],port=r.w<r.h;
 if(D.screen==="hud"&&D.layout==="sheet")add("warn","HUD에 하단 시트나 하단 탭을 두면 게임 장면과 엄지 조작 영역을 가립니다.",9);
 if(D.screen==="hud"&&D.layout==="grid")add("info","HUD의 격자 구성은 모서리에 정보를 나누는 방식으로 표현합니다. 스킬이 많으면 방사형도 시험해 보세요.",9);
 if(["dialogue","quest","settings"].includes(D.screen)&&D.layout==="radial")add("warn","글을 읽는 화면에 방사형 구성은 줄 읽기를 방해합니다.",9);
 if(D.density==="extreme"||(D.density==="dense"&&["inventory","hud","shop"].includes(D.screen)))add("warn","요소가 많으면 이미지 AI가 일부를 빠뜨리거나 뭉갭니다. 이미지용에는 '보통' 밀도를 권합니다.",11);
 if(D.platform==="mobile"&&D.ratio==="21:9")add("warn","21:9는 모바일에서 거의 쓰지 않는 비율입니다.",1);
 if(D.platform==="pc"&&port)add("warn","PC·콘솔을 골랐는데 세로 비율입니다. 플랫폼이나 비율을 다시 확인해 보세요.",1);
 if(D.platform!=="pc"&&D.density==="extreme")add("warn","모바일에서 매우 촘촘한 구성은 44pt 터치 영역을 지키기 어렵습니다.",11);
 const fails=contrastFails();if(fails.length)add("bad",`대비가 부족한 색이 ${fails.length}개 있습니다: ${fails.map(f=>f.ko).join(", ")}.`,"colors");
 const light=contrast(D.colors.bg,"#000000")>10;
 if(D.material==="neon"&&light)add("warn","밝은 배경에서는 네온 발광이 거의 보이지 않습니다.",6);
 if(D.material==="glass"&&(D.engine==="ugui"||D.engine==="uitk"))add("info","Unity에서 유리 블러는 기본 기능이 아니라 별도 셰이더나 캡처 처리가 필요합니다.",7);
 if(["sharp","hex","slant"].includes(D.shape)&&D.engine==="uitk")add("info","UI Toolkit USS에는 clip-path가 없어 깎인 모서리는 스프라이트나 벡터 배경으로 구현해야 합니다.",8);
 if(D.material==="pixel"&&!["pixel","retro","voxel"].includes(D.style))add("warn","픽셀 테두리는 현재 스타일과 어울리지 않을 수 있습니다.",7);
 if(D.style==="pixel"&&["glass","metal","clay"].includes(D.material))add("warn","픽셀 아트와 사실적인 재질은 충돌합니다. 픽셀 테두리나 평면을 권합니다.",7);
 if(D.font==="pixel"&&D.size==="sm")add("warn","도트체를 작게 쓰면 한글이 뭉개집니다.","font");
 if(D.speed==="slow"&&["action","shooter","racing","rhythm"].includes(D.genre))add("warn","빠른 장르에서 340ms 전환은 조작이 늦게 느껴집니다.",10);
 if(D.platform==="pc"&&D.haptic!=="none")add("info","진동은 게임패드 사용 시에만 동작합니다.",10);
 const custom=Object.values(D.custom).join("").length;if(custom>500)add("warn",`직접 설정이 ${custom}자입니다. 길어지면 이미지 AI가 뒤쪽 지시를 무시하기 쉽습니다.`,0);
 return h;
}
function hintRows(h){return h.map((x,i)=>`<div class="hint ${x.lv==="warn"?"":x.lv}"><span>${esc(x.text)}</span>${x.act!==undefined?`<button data-hint="${i}">고치기</button>`:""}</div>`).join("")}
function runHint(act){if(act==="colors")openDrawer("colors");else if(act==="font")openDrawer("font");else go(act)}
function renderFoot(){

 $("#plFoot").innerHTML=`<div class="pl-meta"><span>${D.ratio}</span><span>기준 ${r.ref.join("×")}</span><span>${esc(opt("screen",D.screen).ko)}</span><span>${h.length?`품질 힌트 ${h.length}개`:"품질 힌트 없음"}</span></div>${h.length?`<div class="hints">${hintRows(h)}</div>`:""}`;

async function importBackup(file){
 try{
  const j=JSON.parse(await file.text());
  if(!j||j.app!=="game-ui-prompt-lab"||!Array.isArray(j.saved)||!Array.isArray(j.log))throw new Error("format");
  const sv=getSaved(),lg=getLog(),sid=new Set(sv.map(x=>x.id)),lid=new Set(lg.map(x=>x.id));
  let a=0,b=0;
  for(const x of j.saved){if(x&&typeof x.id==="string"&&x.d&&!sid.has(x.id)){sv.push({id:x.id,name:String(x.name||"이름 없음").slice(0,60),at:Number(x.at)||Date.now(),d:sanitize(x.d)});a++}}
  for(const x of j.log){if(x&&typeof x.id==="string"&&typeof x.text==="string"&&!lid.has(x.id)){lg.push({id:x.id,at:Number(x.at)||Date.now(),title:String(x.title||"기록").slice(0,120),text:x.text.slice(0,60000),label:String(x.label||"").slice(0,120)});b++}}
  sv.sort((p,q)=>q.at-p.at);lg.sort((p,q)=>q.at-p.at);
  setSaved(sv.slice(0,200));setLog(lg.slice(0,300));updateLogCount();renderLog();
  if(UI.drawer&&UI.drTab==="custom")renderDrawerBody(true);
  toast(`디자인 ${a}개, 로그 ${b}개를 불러왔습니다`);
 }catch(e){toast("백업 파일 형식이 아닙니다")}
}

function renderPresets(){

function applyPreset(id){
 const p=PRESETS.find(x=>x.id===id);if(!p)return;
 commit(d=>{Object.assign(d,p.d);applyPalette(d,p.d.palette);d.fontAuto=true});
 for(const s of STEPS)if(s.groups)UI.done[s.key]=true;
 renderSide();renderCenter();persist();toast(p.ko+" 프리셋을 적용했습니다");
}
function randomize(){
 const pickFrom=a=>a[Math.floor(Math.random()*a.length)];
 commit(d=>{
  for(const s of STEPS){
   if(!s.groups||UI.locks[s.key])continue;
   for(const g of s.groups){
    if(g.key==="palette"){applyPalette(d,pickFrom(PALETTES).id);continue}
    d[g.key]=pickFrom(g.opts).id;
    if(g.key==="style"){d.font=opt("style",d.style).font;d.fontAuto=true}
   }
  }
 });
 for(const s of STEPS)if(s.groups&&!UI.locks[s.key])UI.done[s.key]=true;

/* ========== EVENTS + BOOT ========== */
document.addEventListener("click",async e=>{
 const t=e.target;
 const lk=t.closest("[data-lock]");
 if(lk){const k=lk.dataset.lock;UI.locks[k]=!UI.locks[k];renderSide();if(UI.view==="step"&&STEPS[UI.step].groups)renderCenter();persist();toast(UI.locks[k]?"이 단계를 잠갔습니다":"잠금을 풀었습니다");return}
 const st=t.closest("[data-step]");if(st){go(+st.dataset.step);return}
 const op=t.closest(".opt");if(op){pick(op.dataset.g,op.dataset.v);return}
 const gt=t.closest("[data-goto]");if(gt){go(+gt.dataset.goto);return}
 const ht=t.closest("[data-hint]");if(ht){const h=hints()[+ht.dataset.hint];if(h)runHint(h.act);return}
 const rs=t.closest("[data-rs]");if(rs){UI.rsTab=rs.dataset.rs;renderResult();persist();return}
 const lg=t.closest("[data-lang]");if(lg){commit(d=>d.lang=lg.dataset.lang);return}
 const cp=t.closest("[data-copy]");if(cp){const b=blockFor(cp.dataset.copy);if(!b)return;const ok=await copyText(b.text);logAdd(b.title,b.text);toast(ok?"복사하고 로그에 남겼습니다":"클립보드를 쓸 수 없어 로그에만 남겼습니다");return}
 const lo=t.closest("[data-log]");if(lo){const b=blockFor(lo.dataset.log);if(!b)return;logAdd(b.title,b.text);toast("로그에 기록했습니다");return}
 const dr=t.closest("[data-dr]");if(dr){UI.drTab=dr.dataset.dr;renderDrTabs();renderDrawerBody(true);return}
 const fn=t.closest("[data-font]");if(fn){commit(d=>{d.font=fn.dataset.font;d.fontAuto=false});renderDrawerBody(true);return}
 const sz=t.closest("[data-size]");if(sz){commit(d=>d.size=sz.dataset.size);renderDrawerBody(true);return}
 const rf=t.closest("[data-rf]");if(rf){refFilter[rf.dataset.rf]=!refFilter[rf.dataset.rf];renderDrawerBody(true);return}
 const sv=t.closest("[data-sv]");if(sv){
  const row=sv.closest("[data-id]"),id=row.dataset.id,list=getSaved(),it=list.find(x=>x.id===id);if(!it)return;
  if(sv.dataset.sv==="load"){commit(d=>Object.assign(d,sanitize(it.d)));for(const s of STEPS)if(s.groups)UI.done[s.key]=true;renderCenter();renderSide();toast("불러왔습니다")}
  else if(sv.dataset.sv==="del"){setSaved(list.filter(x=>x.id!==id));renderDrawerBody(true);toast("삭제했습니다")}
  else{const nm=$("[data-name]",row);const inp=document.createElement("input");inp.className="in";inp.value=it.name;inp.maxLength=60;inp.style.width="100%";nm.replaceWith(inp);inp.focus();inp.select();const done=()=>{const l=getSaved(),x=l.find(y=>y.id===id);if(x&&inp.value.trim()){x.name=inp.value.trim();setSaved(l)}renderDrawerBody(true)};inp.addEventListener("blur",done,{once:true});inp.addEventListener("keydown",ev=>{if(ev.key==="Enter")inp.blur();if(ev.key==="Escape"){inp.value="";inp.blur()}})}
  return;
 }
 const lgb=t.closest("[data-lg]");if(lgb){
  const id=lgb.closest("[data-id]").dataset.id,l=getLog(),it=l.find(x=>x.id===id);if(!it)return;
  if(lgb.dataset.lg==="view"){renderLog.open=renderLog.open===id?null:id;renderLog()}
  else if(lgb.dataset.lg==="copy"){const ok=await copyText(it.text);toast(ok?"복사했습니다":"클립보드를 쓸 수 없습니다")}
  else{setLog(l.filter(x=>x.id!==id));updateLogCount();renderLog()}
  return;
 }
 const pr=t.closest("[data-preset]");if(pr){$("#dlgPreset").close();applyPreset(pr.dataset.preset);return}
 const cl=t.closest("[data-close]");if(cl){cl.closest("dialog").close();return}
 const id=t.id||(t.closest("button")||{}).id;
 switch(id){
  case"qPrev":go(UI.step-1);break;
  case"qNext":go(UI.step+1);break;
  case"qAll":UI.view="all";UI.query="";renderSide();renderCenter();break;
  case"qBack":UI.view="step";UI.query="";renderSide();renderCenter();break;
  case"bUndo":undo();break;
  case"bRedo":redo();break;
  case"bReset":commit(d=>Object.assign(d,defaults()));UI.done={};UI.locks={};renderSide();renderCenter();persist();toast("초기화했습니다. 되돌리기로 복구할 수 있습니다");break;
  case"bLog":renderLog();$("#dlgLog").showModal();break;
  case"bPreset":renderPresets();$("#dlgPreset").showModal();break;
  case"bRandom":randomize();break;
  case"bCompare":renderCompare();$("#dlgCompare").showModal();break;
  case"cmpQuick":addSaved("");renderCompare();break;
  case"bShare":{const ok=await copyText(shareURL());toast(ok?"공유 링크를 복사했습니다":"링크를 복사하지 못했습니다");break}
  case"bDetail":UI.drawer?closeDrawer():openDrawer();break;
  case"drClose":closeDrawer();break;
  case"svAdd":addSaved(($("#svName")||{}).value);renderDrawerBody(true);break;
  case"logExport":exportBackup();break;
  case"logClear":{
   const btn=$("#logClear");if(!getLog().length)break;
   if(btn.dataset.arm!=="1"){btn.dataset.arm="1";btn.textContent="한 번 더 누르면 삭제";clearTimeout(btn._t);btn._t=setTimeout(()=>{btn.dataset.arm="";btn.textContent="전체 삭제"},3000);break}
   clearTimeout(btn._t);btn.dataset.arm="";btn.textContent="전체 삭제";setLog([]);updateLogCount();renderLog();toast("로그를 모두 지웠습니다");break}
  case"plFrame":UI.frame=!UI.frame;pv.setFrame(UI.frame);syncPlButtons();persist();break;
  case"plDemo":UI.demo=!UI.demo;pv.setDemo(UI.demo&&UI.pvTab==="screen");syncPlButtons();persist();break;
  case"plExport":exportHTML();break;
 }
});
$("#plTabs").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(b)setPvTab(b.dataset.t)});
$("#plZoom").addEventListener("click",e=>{const b=e.target.closest("[data-z]");if(!b)return;UI.zoom=b.dataset.z;$$("#plZoom button").forEach(x=>x.setAttribute("aria-pressed",x===b));pv.setZoom(UI.zoom)});
function syncPlButtons(){$("#plFrame").classList.toggle("on",UI.frame);$("#plFrame").setAttribute("aria-pressed",UI.frame);$("#plDemo").classList.toggle("on",UI.demo);$("#plDemo").setAttribute("aria-pressed",UI.demo)}
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.id==="qSearch"){UI.query=t.value;applyFilter();return}
 if(t.dataset.free){const k=t.dataset.free;commit(d=>{if(t.value)d.custom[k]=t.value;else delete d.custom[k]},"free:"+k);return}
 if(t.dataset.color){setColor(t.dataset.color,t.value);return}
 if(t.dataset.hex){const v=t.value.trim();if(/^#[0-9a-fA-F]{6}$/.test(v))setColor(t.dataset.hex,v);return}
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.id==="logImport"){const f=t.files[0];if(f)importBackup(f);t.value="";return}
 if(t.dataset.cmp){const id=t.dataset.cmp;if(t.checked){if(cmpSel.length>=4){t.checked=false;toast("최대 4개까지 비교할 수 있습니다");return}cmpSel.push(id)}else{if(cmpSel.length<=2){t.checked=true;toast("2개 이상 선택해야 합니다");return}cmpSel=cmpSel.filter(x=>x!==id)}renderCompare()}
});
$("#dlgCompare").addEventListener("close",destroyCompare);
document.addEventListener("keydown",e=>{
 const t=e.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable;
 if((e.ctrlKey||e.metaKey)&&!typing){const k=e.key.toLowerCase();if(k==="z"){e.preventDefault();e.shiftKey?redo():undo();return}if(k==="y"){e.preventDefault();redo();return}}
 if(e.key==="Enter"&&t.matches("label.tbtn")){t.querySelector("input").click();return}
 if(typing||e.ctrlKey||e.metaKey||e.altKey||document.querySelector("dialog[open]"))return;
 if(e.key==="Escape"&&UI.drawer){closeDrawer();return}
 if(e.key==="ArrowRight"){e.preventDefault();if(UI.view==="step")go(UI.step+1);return}
 if(e.key==="ArrowLeft"){e.preventDefault();if(UI.view==="step")go(UI.step-1);return}
 if(/^[0-9]$/.test(e.key)&&UI.view==="step"&&STEPS[UI.step].groups){
  const idx=e.key==="0"?9:+e.key-1,vis=$$("#qOpts .opt:not([hidden])");
  if(vis[idx])pick(vis[idx].dataset.g,vis[idx].dataset.v);
 }
});
window.addEventListener("hashchange",()=>{const h=readHash();if(!h)return;commit(d=>Object.assign(d,h.d));UI.step=h.s;for(const s of STEPS)if(s.groups)UI.done[s.key]=true;UI.view="step";renderSide();renderCenter();clearHash();toast("공유 링크의 디자인을 불러왔습니다")});

function boot(){
 const sv=store.get(LS.state,null),h=readHash();
 if(sv){D=sanitize(sv.d);if(sv.ui){UI.step=Number.isInteger(sv.ui.step)?Math.max(0,Math.min(STEPS.length-1,sv.ui.step)):0;if(sv.ui.done&&typeof sv.ui.done==="object")UI.done=sv.ui.done;if(sv.ui.locks&&typeof sv.ui.locks==="object")UI.locks=sv.ui.locks;if(typeof sv.ui.frame==="boolean")UI.frame=sv.ui.frame;if(typeof sv.ui.demo==="boolean")UI.demo=sv.ui.demo;if(["image","code","tokens","summary"].includes(sv.ui.rsTab))UI.rsTab=sv.ui.rsTab}}
 if(h){D=h.d;UI.step=h.s;for(const s of STEPS)if(s.groups)UI.done[s.key]=true;clearHash()}
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)UI.demo=false;
 pv=P.mount($("#stage"),D,{frame:UI.frame,demo:UI.demo});syncStageRatio();
 new ResizeObserver(()=>document.documentElement.style.setProperty("--hd-real",$(".hd").offsetHeight+"px")).observe($(".hd"));
 renderSide();renderCenter();renderFoot();syncPlButtons();updateLogCount();saveNow();
 if(h)toast("공유 링크의 디자인을 불러왔습니다");
}
boot();
})();
